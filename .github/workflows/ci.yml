name: CI

# Cross-platform proof that the CLI installs, updates, and diagnoses correctly.
# Windows is the load-bearing leg: os.homedir() paths, .cmd shims via execCliSync
# (CVE-2024-27980 shell guard), and fs copy semantics are reasoned about in
# review but only proven here.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      pty_loops:
        description: "Run the pty suite this many times on the Linux legs (flake hunting)"
        type: number
        default: 1
      pty_inject_failure:
        description: "Put a failing fake expect on PATH (Linux legs) to prove the transcript artifact"
        type: boolean
        default: false

jobs:
  cli:
    name: CLI on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (CLI + helper scripts)
        run: |
          node --check bin/akili.js
          node --check scripts/parse_tests.js
          node --check scripts/release.js
          node --check scripts/release-status.js
          node --check scripts/notify-slack.js

      - name: verify:cli (list packaged commands, skills, resources)
        run: npm run verify:cli

      # routing-keyboard-select (P-10): test/routing-pty.test.js drives a real
      # pty through `expect`; macOS runners ship it, Ubuntu needs the package,
      # Windows has no pty and the suite skips with a printed reason.
      - name: Install expect (pty tests, Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Toolchain versions (Linux)
        if: runner.os == 'Linux'
        run: node -v && expect -v

      # bugfix/pty-harness-ubuntu-flake (FR-5): dispatch-only failure injection;
      # the shim is installed executable here (DD-4), never committed as one.
      - name: Inject pty failure (dispatch)
        if: runner.os == 'Linux' && inputs.pty_inject_failure == true
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cp test/fixtures/routing/fake-expect.sh "$RUNNER_TEMP/fake-bin/expect"
          chmod 755 "$RUNNER_TEMP/fake-bin/expect"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"

      - name: Unit tests (node:test)
        run: npm test
        env:
          AKILI_PTY_LOG_DIR: ${{ runner.temp }}/pty-transcripts

      - name: pty loop (dispatch)
        if: runner.os == 'Linux' && inputs.pty_loops > 1
        continue-on-error: false
        env:
          AKILI_PTY_LOG_DIR: ${{ runner.temp }}/pty-transcripts
          PTY_LOOPS: ${{ inputs.pty_loops }}
        run: |
          for i in $(seq 2 "$PTY_LOOPS"); do
            echo "pty loop $i of $PTY_LOOPS"
            node --test test/routing-pty.test.js
          done

      - name: Upload pty transcripts
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pty-transcripts-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/pty-transcripts
          if-no-files-found: ignore

      - name: Dry-run install (all tools)
        run: node bin/akili.js install --tool all --dry-run

      - name: Real install to the runner home (all tools)
        run: node bin/akili.js install --tool all --force

      - name: Doctor (all tools)
        run: node bin/akili.js doctor --tool all

      - name: Idempotent re-install respects skip-by-default
        run: node bin/akili.js install --tool all

      - name: Symlink-defense probe (proves fs semantics per platform/Node)
        run: node scripts/ci/install-symlink-probe.js

      - name: Codex install-layout regression (zero-regression gate + auto-detection fixture)
        run: node scripts/ci/install-layout-regression.js

      - name: Pack dry-run (no stray files enter the tarball)
        run: npm run pack:dry-run
