<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
  <title id="t">AKILI-SPECS methodology lifecycle</title>
  <desc id="d">A one-time constitution step establishes the baseline, then a per-spec loop runs propose, specify, execute, test, validate and archive, with a Kaizen retrospective feeding the next spec. Four commands run outside the loop at any time.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#91c714"/>
    </marker>
  </defs>

  <style>
    .n  { font-family: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .cmd{ font-size: 15px; font-weight: 700; }
    .sub{ font-size: 10.5px; }
    .lbl{ font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; }
    .edge{ stroke:#8a94a6; stroke-width:1.6; fill:none; }
  </style>

  <rect x="0" y="0" width="900" height="600" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="599" rx="14" fill="none" stroke="#e6e8eb"/>

  <text class="n" x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#11151c">AKILI-SPECS — methodology lifecycle</text>

  <!-- Foundation -->
  <rect x="24" y="56" width="852" height="72" rx="10" fill="#f3efff" stroke="#7c3aed" stroke-width="1.6"/>
  <text class="n lbl" x="44" y="76" fill="#7c3aed">RUNS ONCE PER PROJECT</text>
  <text class="n cmd" x="450" y="94" text-anchor="middle" fill="#5b21b6">/akili-constitution</text>
  <text class="n sub" x="450" y="114" text-anchor="middle" fill="#6b5b95">PRD · UX/UI Design · TRD · Infrastructure · .agents/ personas · Model Routing · Skill Map</text>

  <path class="edge" d="M450,128 L450,164" marker-end="url(#a)"/>

  <!-- Per-spec loop -->
  <rect x="24" y="170" width="852" height="290" rx="12" fill="none" stroke="#cfd4dc" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="n lbl" x="44" y="196" fill="#8a94a6">PER-SPEC LOOP</text>

  <!-- Row 1 -->
  <rect x="86" y="218" width="210" height="68" rx="9" fill="#eaf4fb" stroke="#1686c7" stroke-width="1.5"/>
  <text class="n cmd" x="191" y="248" text-anchor="middle" fill="#0e5a86">/akili-propose</text>
  <text class="n sub" x="191" y="268" text-anchor="middle" fill="#3d7fa3">spec folder + intent</text>

  <rect x="346" y="218" width="210" height="68" rx="9" fill="#eaf4fb" stroke="#1686c7" stroke-width="1.5"/>
  <text class="n cmd" x="451" y="248" text-anchor="middle" fill="#0e5a86">/akili-specify</text>
  <text class="n sub" x="451" y="268" text-anchor="middle" fill="#3d7fa3">requirements · design · tasks</text>

  <rect x="606" y="218" width="210" height="68" rx="9" fill="#fbf7e0" stroke="#cfb600" stroke-width="1.5"/>
  <text class="n cmd" x="711" y="248" text-anchor="middle" fill="#7a6c00">/akili-execute</text>
  <text class="n sub" x="711" y="268" text-anchor="middle" fill="#8f8330">Implementer → Reviewer</text>

  <!-- Row 2 (right to left) -->
  <rect x="606" y="358" width="210" height="68" rx="9" fill="#fbf7e0" stroke="#cfb600" stroke-width="1.5"/>
  <text class="n cmd" x="711" y="388" text-anchor="middle" fill="#7a6c00">/akili-test</text>
  <text class="n sub" x="711" y="408" text-anchor="middle" fill="#8f8330">Testers, one per suite</text>

  <rect x="346" y="358" width="210" height="68" rx="9" fill="#f0f8e6" stroke="#91c714" stroke-width="1.5"/>
  <text class="n cmd" x="451" y="388" text-anchor="middle" fill="#4d7a00">/akili-validate</text>
  <text class="n sub" x="451" y="408" text-anchor="middle" fill="#66922b">requirements · tokens · UX</text>

  <rect x="86" y="358" width="210" height="68" rx="9" fill="#f0f8e6" stroke="#91c714" stroke-width="1.5"/>
  <text class="n cmd" x="191" y="388" text-anchor="middle" fill="#4d7a00">/akili-archive</text>
  <text class="n sub" x="191" y="408" text-anchor="middle" fill="#66922b">archive + Kaizen retrospective</text>

  <!-- Flow edges -->
  <path class="edge" d="M296,252 L342,252" marker-end="url(#a)"/>
  <path class="edge" d="M556,252 L602,252" marker-end="url(#a)"/>
  <path class="edge" d="M711,286 L711,354" marker-end="url(#a)"/>
  <path class="edge" d="M606,392 L560,392" marker-end="url(#a)"/>
  <path class="edge" d="M346,392 L300,392" marker-end="url(#a)"/>

  <!-- Kaizen back-edge -->
  <path d="M86,392 L55,392 L55,252 L82,252" fill="none" stroke="#91c714" stroke-width="1.8" marker-end="url(#ak)"/>
  <text class="n lbl" x="44" y="322" text-anchor="middle" fill="#4d7a00" transform="rotate(-90 44 322)">KAIZEN</text>

  <text class="n sub" x="450" y="446" text-anchor="middle" fill="#8a94a6">Every step closes on a human approval gate · author ≠ auditor is enforced at execute and test</text>

  <!-- Anytime -->
  <rect x="24" y="480" width="852" height="96" rx="10" fill="#f7f8fa" stroke="#e0e3e8" stroke-width="1.4"/>
  <text class="n lbl" x="44" y="504" fill="#8a94a6">ANYTIME — OUTSIDE THE LOOP</text>

  <rect x="44" y="516" width="194" height="44" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text class="n" x="141" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#11151c">/akili-resume</text>
  <text class="n sub" x="141" y="551" text-anchor="middle" fill="#8a94a6">multi-spec dashboard</text>

  <rect x="250" y="516" width="194" height="44" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text class="n" x="347" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#11151c">/akili-audit</text>
  <text class="n sub" x="347" y="551" text-anchor="middle" fill="#8a94a6">spec ↔ code drift</text>

  <rect x="456" y="516" width="194" height="44" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text class="n" x="553" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#11151c">/akili-quick</text>
  <text class="n sub" x="553" y="551" text-anchor="middle" fill="#8a94a6">trivial, low-risk change</text>

  <rect x="662" y="516" width="194" height="44" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text class="n" x="759" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#11151c">/akili-seo</text>
  <text class="n sub" x="759" y="551" text-anchor="middle" fill="#8a94a6">SEO + GEO audit</text>
</svg>
